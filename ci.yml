# Configure which branches trigger builds
trigger:
  batch: true
  branches:
    include:
      - main

variables:
  - name: TeamName
    value: dotnet-aspire

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelines/1ESPipelines
      ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      policheck:
        enabled: true
      tsa:
        enabled: true
    pool:
      name: NetCore1ESPool-Svc-Internal
      image: windows.vs2022.amd64
      os: windows
    stages:
      - stage: buildStage
        displayName: Build Stage
        jobs:
          - job: Build
            displayName: Windows Build
            timeoutInMinutes: 90
            workspace:
              clean: all
            steps:
              - task: UseDotNet@2
                inputs:
                  useGlobalJson: true
              - script: npm install --no-audit --no-fund
                displayName: Install frontend dependencies
              - script: npm run build:css
                displayName: Build Tailwind CSS
              - script: dotnet build eShop.Web.slnf
                displayName: Build Step
